<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : une fiche de test « 5 cases » à moitié cochée, note 3/5 en rouge, le présentateur malin bras croisés */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .ink { position:absolute; isolation:isolate; }
  .ink::before { content:""; position:absolute; inset:0; border-radius:inherit; transform:translate(16px, 12px); z-index:-1; background:radial-gradient(circle, #161616 2.4px, transparent 3px) 0 0 / 9px 9px; }
  .ink::after { content:""; position:absolute; inset:0; border-radius:inherit; background:#fff; border:7px solid var(--encre); z-index:-1; }
  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .tag { position:absolute; left:0; right:0; top:140px; text-align:center; font:600 40px/1 var(--mono); letter-spacing:.06em; color:var(--gris); }
  .t1 { position:absolute; left:0; right:0; top:210px; text-align:center; font-weight:800; font-size:116px; letter-spacing:-0.05em; line-height:1.02; }
  #card { left:120px; top:500px; width:840px; padding:40px 50px; box-sizing:border-box; border-radius:44px; transform:rotate(-2.5deg); display:flex; flex-direction:column; gap:18px; }
  .r { display:flex; align-items:center; gap:26px; font-weight:800; font-size:50px; letter-spacing:-0.02em; }
  .b { width:70px; height:70px; border-radius:16px; border:7px solid var(--encre); box-sizing:border-box; flex:none; display:flex; align-items:center; justify-content:center; font:800 52px/1 "Inter"; }
  .ok { background:var(--encre); color:#fff; }
  .no { background:var(--rouge); color:#fff; }
  .note { position:absolute; right:50px; top:960px; padding:14px 34px; border:10px solid var(--rouge); border-radius:18px; color:var(--rouge); background:#fff; font-weight:800; font-size:96px; letter-spacing:-0.02em; transform:rotate(-9deg); }
  #perso { position:absolute; left:-10px; top:960px; width:1100px; }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="tag">// dropshipping</div>
  <div class="t1">Ton produit passe<br>le <span class="it">test</span> ?</div>
  <div class="ink" id="card">
    <div class="r"><div class="b ok">✓</div>règle un problème</div>
    <div class="r"><div class="b ok">✓</div>compris en 3 s</div>
    <div class="r"><div class="b no">✕</div>introuvable près de toi</div>
    <div class="r"><div class="b ok">✓</div>léger et solide</div>
    <div class="r"><div class="b no">✕</div>une vraie marge</div>
  </div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="note">3/5</div>
</div>
</body>
</html>
