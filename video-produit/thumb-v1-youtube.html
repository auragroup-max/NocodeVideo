<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature YouTube</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : une fiche de test « 5 cases » à moitié cochée, note 3/5 en rouge, le présentateur malin bras croisés */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 2.4px, transparent 2.9px); background-size:28px 28px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .ink { position:absolute; isolation:isolate; }
  .ink::before { content:""; position:absolute; inset:0; border-radius:inherit; transform:translate(10px, 8px); z-index:-1; background:radial-gradient(circle, #161616 2px, transparent 2.6px) 0 0 / 7px 7px; }
  .ink::after { content:""; position:absolute; inset:0; border-radius:inherit; background:#fff; border:5px solid var(--encre); z-index:-1; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .t1 { position:absolute; left:60px; top:44px; font-weight:800; font-size:80px; letter-spacing:-0.05em; line-height:1.02; }
  #card { left:66px; top:250px; width:560px; padding:24px 32px; box-sizing:border-box; border-radius:30px; transform:rotate(-2.5deg); display:flex; flex-direction:column; gap:10px; }
  .r { display:flex; align-items:center; gap:16px; font-weight:800; font-size:32px; letter-spacing:-0.02em; }
  .b { width:44px; height:44px; border-radius:10px; border:5px solid var(--encre); box-sizing:border-box; flex:none; display:flex; align-items:center; justify-content:center; font:800 32px/1 "Inter"; }
  .ok { background:var(--encre); color:#fff; }
  .no { background:var(--rouge); color:#fff; }
  .note { position:absolute; left:520px; top:520px; padding:8px 22px; border:7px solid var(--rouge); border-radius:12px; color:var(--rouge); background:#fff; font-weight:800; font-size:64px; transform:rotate(-9deg); }
  #perso { position:absolute; left:680px; top:20px; width:640px; }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="t1">Ton produit passe<br>le <span class="it">test</span> ?</div>
  <div class="ink" id="card">
    <div class="r"><div class="b ok">✓</div>règle un problème</div>
    <div class="r"><div class="b ok">✓</div>compris en 3 s</div>
    <div class="r"><div class="b no">✕</div>introuvable près de toi</div>
    <div class="r"><div class="b ok">✓</div>léger et solide</div>
    <div class="r"><div class="b no">✕</div>une vraie marge</div>
  </div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="note">3/5</div>
</div>
</body>
</html>
