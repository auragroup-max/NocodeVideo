<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok v1 · ticket géant</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : un ticket de caisse géant sur fond de rayons rouges, le total entouré au marqueur */
  :root { --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre);
    background:repeating-conic-gradient(from 0deg at 50% 62%, #E0402A 0deg 9deg, #CF3620 9deg 18deg); }
  .t1 { position:absolute; left:70px; top:120px; font-weight:800; font-size:106px; letter-spacing:-0.045em; color:#fff; text-shadow:7px 7px 0 var(--encre); white-space:nowrap; }
  .t2 { position:absolute; left:60px; top:262px; padding:6px 30px 12px; background:var(--jaune); border:7px solid var(--encre); border-radius:18px; transform:rotate(-3deg);
    font-weight:800; font-size:150px; line-height:1; letter-spacing:-0.045em; box-shadow:12px 12px 0 var(--encre); white-space:nowrap; }
  .recu { position:absolute; left:170px; top:510px; width:740px; height:800px; transform:rotate(-5deg); filter:drop-shadow(18px 16px 0 #141414); }
  .papier { position:absolute; inset:0; background:#FFFDF8; padding:58px 46px 0; box-sizing:border-box; font-family:var(--mono); }
  .h { text-align:center; font-weight:800; font-size:34px; letter-spacing:.02em; }
  .m { text-align:center; font-weight:600; font-size:24px; color:var(--gris); margin-top:6px; }
  .sep { border-bottom:5px dashed var(--encre); margin:24px 0 14px; }
  .l { display:flex; align-items:center; gap:10px; height:62px; font-weight:700; font-size:32px; white-space:nowrap; }
  .l i { flex:1; border-bottom:5px dotted #B8B2A6; margin-top:14px; }
  .l b { font-weight:800; }
  .l.red { background:var(--rouge); color:#fff; margin:0 -16px; padding:0 16px; border-radius:10px; }
  .l.red i { border-color:rgba(255,255,255,.6); }
  .tot { margin-top:4px; font-weight:800; font-size:34px; }
  .flou { filter:blur(13px); }
  .val { position:relative; margin-top:4px; font-family:"Inter", sans-serif; font-weight:800; font-size:86px; letter-spacing:-0.045em; white-space:nowrap; }
  .entoure { position:absolute; left:-62px; top:-30px; width:760px; height:170px; overflow:visible; }
  .cri { position:absolute; left:860px; top:930px; font-family:"Instrument Serif", serif; font-style:italic; font-size:220px; line-height:1; color:var(--jaune);
    -webkit-text-stroke:6px var(--encre); paint-order:stroke fill; transform:rotate(10deg); }
  #perso { position:absolute; left:-40px; top:1070px; width:1080px; }
</style>
</head>
<body>
<div id="t">
  <div class="t1">Combien ça coûte</div>
  <div class="t2">VRAIMENT ?</div>
  <div class="recu"><div class="papier" id="papier">
    <div class="h">★ DROPSHIPPING MADA ★</div>
    <div class="m">CAISSE 01 · ANTANANARIVO</div>
    <div class="sep"></div>
    <div class="l"><span>LLC (SOCIÉTÉ US)</span><i></i><b>???</b></div>
    <div class="l"><span>NOM DE DOMAINE</span><i></i><b>???</b></div>
    <div class="l"><span>SHOPIFY / MOIS</span><i></i><b>???</b></div>
    <div class="l red"><span>PUBLICITÉ</span><i></i><b>???</b></div>
    <div class="sep"></div>
    <div class="tot">TOTAL · À PARTIR DE</div>
    <div class="val"><span class="flou">3 000 000</span> Ar
      <svg class="entoure" viewBox="0 0 720 170"><path d="M40 92 C 40 30, 300 8, 520 18 C 690 26, 712 92, 640 132 C 560 172, 220 168, 90 140 C 20 124, 12 70, 90 44" fill="none" stroke="#E0402A" stroke-width="10" stroke-linecap="round"/></svg>
    </div>
  </div></div>
  <div class="cri">?!</div>
  <img id="perso" src="assets/thumb-perso.png" alt="">
</div>
<script>
  // bords dentelés du ticket, en haut et en bas
  const z = []; for (let x = 0; x <= 740; x += 20) z.push(`${x}px ${(x / 20) % 2 ? 0 : 18}px`);
  const b = []; for (let x = 740; x >= 0; x -= 20) b.push(`${x}px calc(100% - ${(x / 20) % 2 ? 0 : 18}px)`);
  document.getElementById("papier").style.clipPath = `polygon(${z.join(",")}, ${b.join(",")})`;
</script>
</body>
</html>
