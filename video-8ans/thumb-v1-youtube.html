<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature YouTube</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; color:var(--encre); font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased;
    background-color:var(--papier); background-image:radial-gradient(#CFC9BE 2.4px, transparent 3px); background-size:28px 28px; }
  .label { position:absolute; left:72px; top:110px; font:600 24px/1 var(--mono); letter-spacing:.04em; color:var(--gris); }
  h1 { position:absolute; left:66px; top:160px; margin:0; font-weight:800; letter-spacing:-0.045em; line-height:1.04; }
  h1 .a, h1 .b { display:block; font-size:72px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; font-size:1.5em; letter-spacing:-0.01em; color:var(--rouge); }
  .stamp { position:absolute; left:78px; top:500px; padding:10px 20px; border:6px solid var(--encre); border-radius:12px; background:#fff; font-weight:800; font-size:34px; letter-spacing:.06em; transform:rotate(-4deg); white-space:nowrap; box-shadow:7px 7px 0 var(--encre); }
  .stamp b { color:var(--rouge); }
  #perso { position:absolute; left:600px; top:-30px; width:726px; }
</style>
</head>
<body>
<div id="t">
  <div class="label">// le dropshipping — version 8 ans</div>
  <h1><span class="a">Expliqué à un</span><span class="b">enfant de <span class="it">8 ans.</span></span></h1>
  <div class="stamp"><b>4</b> ÉTAPES</div>
  <img id="perso" src="assets/thumb-perso.png" alt="">
</div>
</body>
</html>
