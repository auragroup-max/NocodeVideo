<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  #t { position:relative; width:1080px; height:1920px; overflow:hidden; color:var(--encre); font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased;
    background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .label { position:absolute; left:80px; top:290px; font:600 30px/1 var(--mono); letter-spacing:.04em; color:var(--gris); }
  h1 { position:absolute; left:74px; top:350px; margin:0; font-weight:800; letter-spacing:-0.045em; line-height:1.02; }
  h1 .a { display:block; font-size:116px; }
  h1 .b { display:block; font-size:116px; }
  .k { position:relative; display:inline-block; isolation:isolate; padding:0 .05em; color:#fff; }
  .k i { position:absolute; left:-.05em; right:-.05em; top:.1em; bottom:.04em; z-index:-1; border-radius:.08em; background:var(--rouge); }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; font-size:1.5em; letter-spacing:-0.01em; color:var(--rouge); }
  .stamp { position:absolute; left:600px; top:750px; padding:12px 24px; border:7px solid var(--encre); border-radius:14px; background:#fff; font-weight:800; font-size:42px; letter-spacing:.06em; transform:rotate(-6deg); white-space:nowrap; box-shadow:9px 9px 0 var(--encre); }
  .stamp b { color:var(--rouge); }
  #perso { position:absolute; left:0; top:760px; width:1080px; }
</style>
</head>
<body>
<div id="t">
  <div class="label">// le dropshipping — version 8 ans</div>
  <h1><span class="a">Expliqué à un</span><span class="b">enfant de <span class="it">8 ans.</span></span></h1>
  <img id="perso" src="assets/thumb-perso.png" alt="">
  <div class="stamp"><b>4</b> ÉTAPES</div>
</div>
</body>
</html>
