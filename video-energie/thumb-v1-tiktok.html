<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok v1 · le titre censuré</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : le titre est censuré par une grosse barre « BIP », le présentateur sourit en coin */

  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .bar { position:absolute; display:flex; align-items:center; justify-content:center; background:var(--encre); color:#fff; font-family:var(--mono); font-weight:800; }
  .bar::before { content:""; position:absolute; inset:0; border-radius:inherit; z-index:-1; background:radial-gradient(circle, #161616 2.6px, transparent 3.2px) 0 0 / 10px 10px; transform:translate(18px, 14px); }
  .bar em { font-style:normal; color:var(--jaune); }
  .k { position:relative; display:inline-block; color:#fff; isolation:isolate; padding:0 .08em; }
  .k::before { content:""; position:absolute; left:-.04em; right:-.04em; top:.1em; bottom:.04em; z-index:-1; border-radius:.08em; background:var(--rouge); }
  .stamp { position:absolute; padding:12px 24px; border:8px solid var(--rouge); border-radius:14px; color:var(--rouge); background:#fff; font-weight:800; letter-spacing:.05em; white-space:nowrap; }

  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .t0 { position:absolute; left:0; right:0; top:130px; text-align:center; font-size:84px; line-height:1; }
  .t1 { position:absolute; left:0; right:0; top:250px; text-align:center; font-weight:800; font-size:150px; letter-spacing:-0.055em; line-height:1; }
  .bar { left:110px; top:440px; width:860px; height:200px; border-radius:26px; font-size:118px; letter-spacing:.14em; gap:40px; transform:rotate(-3deg); isolation:isolate; }
  .stamp { right:40px; top:590px; font-size:44px; transform:rotate(-8deg); }
  .t3 { position:absolute; left:0; right:0; top:730px; text-align:center; font-weight:800; font-size:104px; letter-spacing:-0.05em; line-height:1.06; }
  #perso { position:absolute; left:60px; top:900px; width:960px; transform:scaleX(-1); }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="t0 it">Pose tes doigts.</div>
  <div class="t1">Arrête de te</div>
  <div class="bar"><em>✱</em>BIP<em>✱</em></div>
  <div class="stamp">SANS FILTRE</div>
  <div class="t3">…et commence<br>ton <span class="k">business</span>.</div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
</div>
</body>
</html>
