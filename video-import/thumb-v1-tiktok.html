<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : la route en pointillé Chine → ton pays, un colis en vol, étiquette « ¥ 9 », le présentateur qui montre la route */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .k { position:relative; display:inline-block; color:#fff; isolation:isolate; padding:0 .08em; }
  .k::before { content:""; position:absolute; left:-.04em; right:-.04em; top:.1em; bottom:.04em; z-index:-1; border-radius:.08em; background:var(--rouge); }
  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .tag { position:absolute; left:0; right:0; top:140px; text-align:center; font:600 40px/1 var(--mono); letter-spacing:.06em; color:var(--gris); }
  .t1 { position:absolute; left:0; right:0; top:210px; text-align:center; font-weight:800; font-size:98px; letter-spacing:-0.05em; line-height:1.02; }
  #route { position:absolute; left:40px; top:600px; width:1000px; height:440px; overflow:visible; }
  .pin { position:absolute; display:flex; flex-direction:column; align-items:center; gap:8px; font:800 46px/1 "Inter"; }
  .pin svg { width:150px; height:150px; }
  .price { position:absolute; left:640px; top:600px; padding:14px 30px; border-radius:20px; background:#fff; border:8px solid var(--encre); font:800 70px/1 "Inter"; color:var(--rouge); transform:rotate(-6deg); box-shadow:14px 12px 0 #141414; }
  #perso { position:absolute; left:-10px; top:1000px; width:1100px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-pin" viewBox="0 0 120 120"><path d="M60 112 C 40 86 18 64 18 42 A 42 42 0 0 1 102 42 C 102 64 80 86 60 112 Z" fill="#E0402A" stroke="#141414" stroke-width="7" stroke-linejoin="round"/><circle cx="60" cy="42" r="15" fill="#fff" stroke="#141414" stroke-width="6"/></symbol>
  <symbol id="i-box" viewBox="0 0 120 120"><path d="M60 12 L104 34 L104 86 L60 108 L16 86 L16 34 Z" fill="#C98B5A" stroke="#141414" stroke-width="6" stroke-linejoin="round"/><path d="M16 34 L60 56 L104 34 M60 56 L60 108" fill="none" stroke="#141414" stroke-width="6"/></symbol>
</svg>
<div id="t" class="dots">
  <div class="tag">// import · peu importe ton pays</div>
  <div class="t1">Commande en <span class="k">Chine</span>,<br>revends <span class="it">chez toi</span>.</div>
  <svg id="route" viewBox="0 0 1000 440"><path d="M 110 360 C 300 40 700 40 890 360" fill="none" stroke="#141414" stroke-width="12" stroke-dasharray="4 30" stroke-linecap="round"/><use href="#i-box" x="430" y="70" width="140" height="140"/></svg>
  <div class="pin" style="left:70px;top:860px"><svg viewBox="0 0 120 120"><use href="#i-pin"/></svg>CHINE</div>
  <div class="pin" style="left:830px;top:860px"><svg viewBox="0 0 120 120"><use href="#i-pin"/></svg>TOI</div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="price">¥ 9</div>
</div>
</body>
</html>
