<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : trois cartes de paiement en éventail, tampon rouge « CARTE REFUSÉE ? », le présentateur à lunettes */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .tag { position:absolute; left:0; right:0; top:140px; text-align:center; font:600 40px/1 var(--mono); letter-spacing:.06em; color:var(--gris); }
  .t1 { position:absolute; left:0; right:0; top:210px; text-align:center; font-weight:800; font-size:104px; letter-spacing:-0.05em; line-height:1.02; }
  .cd { position:absolute; width:520px; height:320px; border-radius:30px; border:8px solid var(--encre); box-sizing:border-box; padding:34px 40px; color:#fff; box-shadow:18px 14px 0 rgba(20,20,20,.9); }
  .cd .chip { width:76px; height:58px; border-radius:12px; background:#F6C21C; border:4px solid var(--encre); }
  .cd b { position:absolute; left:40px; bottom:34px; font:800 50px/1 "Inter"; }
  .cd i { position:absolute; right:40px; bottom:34px; font:800 italic 54px/1 "Inter"; font-style:italic; }
  .stamp { position:absolute; left:110px; top:1040px; padding:16px 34px; border:10px solid var(--rouge); border-radius:18px; color:var(--rouge); background:#fff; font-weight:800; font-size:72px; letter-spacing:.03em; transform:rotate(-8deg); white-space:nowrap; }
  #perso { position:absolute; left:-10px; top:1080px; width:1100px; }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="tag">// import · payer en Chine</div>
  <div class="t1">Payer sur <span class="it">Taobao</span><br>depuis chez toi</div>
  <div class="cd" style="left:90px;top:560px;transform:rotate(-12deg);background:linear-gradient(135deg,#6A4BD8,#2A1E5C)"><div class="chip"></div><b>CRYPTO</b><i>₿</i></div>
  <div class="cd" style="left:280px;top:600px;transform:rotate(-2deg);background:linear-gradient(135deg,#3BA6F5,#1677FF)"><div class="chip" style="background:#fff"></div><b>Alipay</b></div>
  <div class="cd" style="left:470px;top:650px;transform:rotate(9deg);background:linear-gradient(135deg,#FF7A00,#E0402A)"><div class="chip"></div><b>AKORY</b><i>VISA</i></div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="stamp">CARTE REFUSÉE ?</div>
</div>
</body>
</html>
