<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature YouTube</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : trois cartes de paiement en éventail, tampon rouge « CARTE REFUSÉE ? », le présentateur à lunettes */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 2.4px, transparent 2.9px); background-size:28px 28px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .t1 { position:absolute; left:60px; top:44px; font-weight:800; font-size:80px; letter-spacing:-0.05em; line-height:1.02; }
  .cd { position:absolute; width:340px; height:210px; border-radius:22px; border:6px solid var(--encre); box-sizing:border-box; padding:22px 26px; color:#fff; box-shadow:12px 10px 0 rgba(20,20,20,.9); }
  .cd .chip { width:52px; height:40px; border-radius:9px; background:#F6C21C; border:3px solid var(--encre); }
  .cd b { position:absolute; left:26px; bottom:22px; font:800 34px/1 "Inter"; }
  .cd i { position:absolute; right:26px; bottom:22px; font:800 italic 36px/1 "Inter"; }
  .stamp { position:absolute; left:250px; top:560px; padding:8px 22px; border:7px solid var(--rouge); border-radius:12px; color:var(--rouge); background:#fff; font-weight:800; font-size:46px; transform:rotate(-8deg); white-space:nowrap; }
  #perso { position:absolute; left:680px; top:20px; width:640px; }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="t1">Payer sur <span class="it">Taobao</span><br>depuis chez toi</div>
  <div class="cd" style="left:60px;top:300px;transform:rotate(-12deg);background:linear-gradient(135deg,#6A4BD8,#2A1E5C)"><div class="chip"></div><b>CRYPTO</b><i>₿</i></div>
  <div class="cd" style="left:200px;top:320px;transform:rotate(-2deg);background:linear-gradient(135deg,#3BA6F5,#1677FF)"><div class="chip" style="background:#fff"></div><b>Alipay</b></div>
  <div class="cd" style="left:340px;top:350px;transform:rotate(9deg);background:linear-gradient(135deg,#FF7A00,#E0402A)"><div class="chip"></div><b>AKORY</b><i>VISA</i></div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="stamp">CARTE REFUSÉE ?</div>
</div>
</body>
</html>
