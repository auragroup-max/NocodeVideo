<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature YouTube</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : un tableau de bord de boutique à « 0 vente », tamponné « 3 ERREURS », le présentateur sceptique bras croisés */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 2.4px, transparent 2.9px); background-size:28px 28px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .ink { position:absolute; isolation:isolate; }
  .ink::before { content:""; position:absolute; inset:0; border-radius:inherit; transform:translate(10px, 8px); z-index:-1; background:radial-gradient(circle, #161616 2px, transparent 2.6px) 0 0 / 7px 7px; }
  .ink::after { content:""; position:absolute; inset:0; border-radius:inherit; background:#fff; border:5px solid var(--encre); z-index:-1; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .t1 { position:absolute; left:60px; top:50px; font-weight:800; font-size:86px; letter-spacing:-0.05em; line-height:1.02; }
  #shop { left:66px; top:300px; width:560px; height:290px; border-radius:30px; transform:rotate(-3deg); }
  #shop .bar { position:absolute; left:0; right:0; top:0; height:58px; border-bottom:5px solid var(--encre); display:flex; align-items:center; gap:10px; padding:0 22px; box-sizing:border-box; }
  #shop .bar i { width:16px; height:16px; border-radius:50%; border:4px solid var(--encre); box-sizing:border-box; display:block; }
  #shop .bar i:first-child { background:var(--rouge); }
  #shop .zero { position:absolute; left:40px; top:84px; font-weight:800; font-size:170px; letter-spacing:-0.06em; line-height:1; }
  #shop .zero small { font-size:48px; color:var(--gris); margin-left:14px; letter-spacing:-0.01em; }
  .stamp { position:absolute; left:400px; top:540px; padding:10px 22px; border:7px solid var(--rouge); border-radius:12px; color:var(--rouge); background:#fff; font-weight:800; font-size:48px; letter-spacing:.04em; transform:rotate(-9deg); white-space:nowrap; }
  #perso { position:absolute; left:680px; top:20px; width:640px; }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="t1">Ta boutique ne<br>vend <span class="it">rien</span> ?</div>
  <div class="ink" id="shop"><div class="bar"><i></i><i></i><i></i></div><div class="zero">0<small>vente</small></div></div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="stamp">3 ERREURS</div>
</div>
</body>
</html>
