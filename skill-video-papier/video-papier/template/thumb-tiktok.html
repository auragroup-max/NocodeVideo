<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* MODÈLE : change le concept à chaque vidéo (voir docs/recettes.md, « Miniatures »). Garde la DA papier et un titre lisible en tout petit. */

  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .k { position:relative; display:inline-block; color:#fff; isolation:isolate; padding:0 .08em; }
  .k::before { content:""; position:absolute; left:-.04em; right:-.04em; top:.1em; bottom:.04em; z-index:-1; border-radius:.08em; background:var(--rouge); }
  .stamp { position:absolute; padding:12px 24px; border:8px solid var(--rouge); border-radius:14px; color:var(--rouge); background:#fff; font-weight:800; letter-spacing:.05em; white-space:nowrap; }

  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .tag { position:absolute; left:0; right:0; top:150px; text-align:center; font:600 40px/1 var(--mono); letter-spacing:.06em; color:var(--gris); }
  .t1 { position:absolute; left:0; right:0; top:240px; text-align:center; font-weight:800; font-size:150px; letter-spacing:-0.055em; line-height:1; }
  .t2 { position:absolute; left:0; right:0; top:420px; text-align:center; font-weight:800; font-size:130px; letter-spacing:-0.05em; line-height:1.05; }
  .stamp { right:70px; top:660px; font-size:48px; transform:rotate(-8deg); }
  #perso { position:absolute; left:-10px; top:760px; width:1100px; transform:scaleX(-1); }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="tag">// ton sujet</div>
  <div class="t1">Ton titre</div>
  <div class="t2">en <span class="k">5 mots</span> <span class="it">max.</span></div>
  <div class="stamp">TAMPON</div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
</div>
</body>
</html>
