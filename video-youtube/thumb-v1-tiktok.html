<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : un vrai chiffre en très grand, le présentateur surpris qui le montre, et le vote « LIVE ou PRIVÉ ? » */
  :root { --papier:#F1EEE8; --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
  html, body { margin:0; background:#000; }
  .dots { background-color:var(--papier); background-image:radial-gradient(#CFC9BE 3px, transparent 3.6px); background-size:36px 36px; }
  .it { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; color:var(--rouge); letter-spacing:-0.01em; }
  .k { position:relative; display:inline-block; color:#fff; isolation:isolate; padding:0 .08em; }
  .k::before { content:""; position:absolute; left:-.04em; right:-.04em; top:.1em; bottom:.04em; z-index:-1; border-radius:.08em; background:var(--rouge); }
  .ink { position:absolute; isolation:isolate; }
  .ink::before { content:""; position:absolute; inset:0; border-radius:inherit; transform:translate(14px, 10px); z-index:-1; background:radial-gradient(circle, #161616 2.2px, transparent 2.8px) 0 0 / 8px 8px; }
  .ink::after { content:""; position:absolute; inset:0; border-radius:inherit; background:#fff; border:6px solid var(--encre); z-index:-1; }

  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .tag { position:absolute; left:0; right:0; top:150px; text-align:center; font:600 40px/1 var(--mono); letter-spacing:.06em; color:var(--gris); }
  .pq { position:absolute; left:0; right:0; top:226px; text-align:center; font-size:130px; line-height:1; }
  .num { position:absolute; left:0; right:0; top:330px; text-align:center; font-weight:800; font-size:330px; letter-spacing:-0.07em; line-height:1; }
  .mois { position:absolute; left:0; right:0; top:660px; text-align:center; font-weight:800; font-size:104px; letter-spacing:-0.05em; line-height:1; }
  .yt { position:absolute; left:0; right:0; top:790px; text-align:center; font-weight:800; font-size:118px; letter-spacing:-0.05em; line-height:1; }
  .vote { display:flex; align-items:center; gap:22px; height:150px; padding:0 36px; border-radius:75px; font-weight:800; font-size:76px; letter-spacing:-0.04em; top:1000px; }
  .vote .dot { width:48px; height:48px; border-radius:50%; background:var(--rouge); border:6px solid var(--encre); box-sizing:border-box; }
  .vote svg { width:80px; height:80px; }
  #v1 { left:56px; transform:rotate(-4deg); }
  #v2 { right:40px; transform:rotate(4deg); }
  .ou { position:absolute; left:50%; top:1036px; width:110px; height:110px; margin-left:-55px; border-radius:50%; background:var(--jaune); border:6px solid var(--encre); box-sizing:border-box; display:flex; align-items:center; justify-content:center; font:800 44px/1 "Inter", sans-serif; z-index:2; }
  #perso { position:absolute; left:-10px; top:1040px; width:1100px; }
</style>
</head>
<body>
<div id="t" class="dots">
  <div class="tag">// tu m'as demandé comment</div>
  <div class="pq it">presque</div>
  <div class="num">250 €</div>
  <div class="mois">par mois,</div>
  <div class="yt">avec <span class="k">YouTube</span>.</div>
  <img id="perso" src="assets/thumb-perso.png" alt="" />
  <div class="ink vote" id="v1"><i class="dot"></i>LIVE</div>
  <div class="ou">ou</div>
  <div class="ink vote" id="v2"><svg viewBox="0 0 120 120"><path d="M36 54 L36 38 A24 24 0 0 1 84 38 L84 54" fill="none" stroke="#141414" stroke-width="9"/><rect x="22" y="52" width="76" height="58" rx="12" fill="#F6C21C" stroke="#141414" stroke-width="7"/><circle cx="60" cy="77" r="8" fill="#141414"/></svg>PRIVÉ ?</div>
</div>
</body>
</html>
