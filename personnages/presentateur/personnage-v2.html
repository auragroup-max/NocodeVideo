<!-- Styles de la scène : ils partent aussi dans l'export PNG -->
<style id="css-scene">
  #scene, #scene * { box-sizing: border-box; }
  #scene { position: relative; overflow: hidden; transform-origin: 0 0; background: #F1EEE8; color: #141414;
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #scene .fond, #scene .fond-img, #scene .voile { position: absolute; inset: 0; }
  #scene .fond-img { background-size: cover; background-position: center; }
  #scene .el { position: absolute; transform-origin: 50% 50%; }
  #scene .txt { overflow-wrap: break-word; }
  #scene .el-titre { font-weight: 800; line-height: 1.03; letter-spacing: -0.02em; }
  #scene .el-texte { font-weight: 500; line-height: 1.3; }
  #scene .el-label { width: max-content; white-space: nowrap; font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace; font-weight: 600; letter-spacing: .04em; }
  #scene em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; color: #E0402A; letter-spacing: 0; }
  #scene .k { background: #E0402A; color: #fff; padding: 0 .14em; border-radius: .1em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #scene .el-carte, #scene .el-bulle { isolation: isolate; }
  #scene .el-carte .boite { position: relative; background: #fff; border: 5px solid #141414; border-radius: 24px; padding: .55em .75em; font-weight: 700; line-height: 1.15; }
  #scene .el-carte .boite::before { content: ""; position: absolute; inset: -5px; transform: translate(18px, 18px); border-radius: 24px; z-index: -1;
    background: radial-gradient(#141414 2.6px, transparent 3px) 0 0 / 11px 11px; }
  #scene .el-bulle .boite { position: relative; background: #fff; border: 5px solid #141414; border-radius: 40px; padding: .5em .75em; font-weight: 700; line-height: 1.15; }
  #scene .el-bulle .queue { position: absolute; left: 14%; top: calc(100% - 5px); width: 70px; height: 52px; overflow: visible; }
  #scene .el-pastille { width: max-content; white-space: nowrap; }
  #scene .el-pastille .boite { display: inline-block; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; padding: .16em .42em .2em; border-radius: .28em; }
  #scene .el-forme .boite { width: 100%; height: 100%; }
  #scene .el svg.dessin, #scene .el img { display: block; width: 100%; height: 100%; }
  #scene .el-perso svg { display: block; width: 100%; height: auto; overflow: visible; }
</style>

<style>
  :root {
    --papier: #F1EEE8; --encre: #141414; --gris: #6B675F; --rouge: #E0402A; --carte: #FFFFFF;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--papier); color: var(--encre); font: 14px/1.4 "Inter", system-ui, sans-serif; }

  .barre { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--papier); border-bottom: 1.5px solid #0000001a; }
  .marque { font: 600 13px/1 var(--mono); letter-spacing: .06em; color: var(--gris); }
  .marque b { color: var(--rouge); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  button { font: 600 13px/1 "Inter", system-ui, sans-serif; padding: 8px 12px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--encre); background: var(--carte); color: var(--encre); }
  button[aria-pressed="true"] { background: var(--encre); color: var(--carte); }
  button.principal { background: var(--rouge); border-color: var(--rouge); color: #fff; }
  button.danger { border-color: var(--rouge); color: var(--rouge); }
  button:disabled { opacity: .35; cursor: default; }
  label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--rouge); width: 16px; height: 16px; }
  input[type="color"] { width: 36px; height: 28px; border: 1.5px solid var(--encre); border-radius: 6px; padding: 0; background: none; cursor: pointer; }

  .studio { display: grid; grid-template-columns: 290px minmax(0, 1fr) 320px; gap: 20px; padding: 16px; align-items: start; }
  .col { display: grid; gap: 20px; align-content: start; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; padding: 2px 4px 2px 2px; }
  .groupe h2 { margin: 0 0 8px; font: 600 12px/1 var(--mono); color: var(--gris); letter-spacing: .06em; text-transform: uppercase; }
  .boutons { display: flex; flex-wrap: wrap; gap: 6px; }
  .grille-ajout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .grille-ajout button { border-radius: 12px; text-align: left; padding: 10px; }
  .nuancier { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .nuancier button { width: 30px; height: 30px; padding: 0; border-radius: 50%; }
  .nuancier button[aria-pressed="true"] { outline: 3px solid var(--rouge); outline-offset: 2px; }
  .ligne-reglage { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .curseur { display: grid; gap: 4px; margin-top: 10px; font-size: 13px; cursor: default; }
  .curseur span { display: flex; justify-content: space-between; }
  .curseur output { font: 500 12px/1 var(--mono); color: var(--gris); }
  .curseur input { width: 100%; accent-color: var(--rouge); }
  .options { display: grid; gap: 8px; }
  .astuce { margin: 6px 0 0; font: 500 12px/1.55 var(--mono); color: var(--gris); }
  .vide { margin: 0; font-size: 14px; line-height: 1.55; color: var(--gris); }
  textarea { width: 100%; min-height: 90px; resize: vertical; padding: 10px; font: 500 15px/1.4 "Inter", system-ui, sans-serif;
    border: 1.5px solid var(--encre); border-radius: 10px; background: #fff; color: var(--encre); }
  #proprietes { display: grid; gap: 20px; }
  .calques { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .calques button { width: 100%; text-align: left; border-radius: 10px; padding: 8px 10px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cache { display: none !important; }

  .centre { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 8px; min-width: 0; }
  .cadre { width: 100%; display: flex; justify-content: center; }
  .porte { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 1px 0 #0000001a, 0 12px 40px #0000001f; touch-action: none; }
  .porte > #scene { position: absolute; left: 0; top: 0; }
  .aide { margin: 0; font: 500 12px/1.5 var(--mono); color: var(--gris); text-align: center; }

  /* Outils d'édition dans la scène (jamais exportés) */
  #scene .el { cursor: move; user-select: none; }
  #scene .el.sel { outline: calc(3px * var(--inv, 1)) dashed var(--rouge); outline-offset: calc(6px * var(--inv, 1)); }
  #scene .poignee { position: absolute; z-index: 2; width: calc(20px * var(--inv, 1)); height: calc(20px * var(--inv, 1));
    background: #fff; border: calc(3px * var(--inv, 1)) solid var(--rouge); border-radius: 50%; }
  #scene .p-taille { right: calc(-16px * var(--inv, 1)); bottom: calc(-16px * var(--inv, 1)); border-radius: 4px; cursor: nwse-resize; }
  #scene .p-rot { left: 50%; top: calc(-50px * var(--inv, 1)); margin-left: calc(-10px * var(--inv, 1)); cursor: grab; }
  #scene .aide-ui { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
  #scene .guide { position: absolute; background: var(--rouge); }
  #scene .guide-v { top: 0; bottom: 0; width: calc(2px * var(--inv, 1)); }
  #scene .guide-h { left: 0; right: 0; height: calc(2px * var(--inv, 1)); }
  #scene .zone { position: absolute; padding: calc(6px * var(--inv, 1)); border: calc(2px * var(--inv, 1)) dashed #E0402A99;
    background: repeating-linear-gradient(45deg, #E0402A22 0 14px, transparent 14px 28px);
    font: 600 calc(13px * var(--inv, 1))/1.2 var(--mono); color: var(--rouge); }

  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 10; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px;
    background: var(--encre); color: #fff; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }

  @media (max-width: 1100px) {
    .barre { position: static; }
    .studio { grid-template-columns: minmax(0, 1fr); }
    .col { position: static; max-height: none; overflow: visible; }
    .centre { order: -1; }
  }
</style>
</head>
<body>
<header class="barre">
  <div class="marque">// studio présentateur <b>v2</b></div>
  <div class="actions">
    <button id="annuler" title="Ctrl+Z">↶ Annuler</button>
    <button id="retablir" title="Ctrl+Y">↷ Rétablir</button>
    <label><input type="checkbox" id="zones"> Zones cachées par l'appli</label>
    <button id="nouvelle">Nouvelle scène</button>
    <button id="ouvrir">Ouvrir…</button>
    <button id="enregistrer">Enregistrer .json</button>
    <button id="png" class="principal">Télécharger PNG</button>
  </div>
</header>

<main class="studio">
  <aside class="col">
    <div class="groupe"><h2>// Format</h2><div class="boutons" id="formats"></div></div>
    <div class="groupe">
      <h2>// Arrière-plan</h2>
      <div class="boutons" id="fonds"></div>
      <div class="nuancier" id="fond-presets"></div>
      <div class="ligne-reglage">
        <label><input type="color" id="fond-couleur"> Fond</label>
        <label class="si-motif"><input type="color" id="fond-motif"> Motif</label>
      </div>
      <label class="curseur si-motif"><span>Taille du motif <output id="o-fond-taille"></output></span><input type="range" id="fond-taille" min="10" max="140"></label>
      <div class="si-image">
        <div class="boutons" style="margin-top:10px"><button id="fond-importer">Changer l'image…</button></div>
        <label class="curseur"><span>Voile de couleur <output id="o-fond-voile"></output></span><input type="range" id="fond-voile" min="0" max="90"></label>
        <label class="curseur"><span>Flou <output id="o-fond-flou"></output></span><input type="range" id="fond-flou" min="0" max="30"></label>
      </div>
    </div>
    <div class="groupe"><h2>// Ajouter</h2><div class="grille-ajout" id="ajouts"></div></div>
    <div class="groupe"><h2>// Calques (du dessus au fond)</h2><ol class="calques" id="calques"></ol></div>
  </aside>

  #perso .f-trait { fill: var(--trait); }
  #perso .f-rouge { fill: var(--rouge); }
  #perso .f-bouche { fill: var(--bouche); }
  #perso .f-langue { fill: var(--langue); }
  #perso .f-casque { fill: var(--casque); }
  #perso .f-casque2 { fill: color-mix(in srgb, var(--casque) 55%, #000); }
  #perso .o { stroke: var(--trait); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
  #perso .o-seul { fill: none; }
  #perso .o-fin { fill: none; stroke: var(--trait); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  #perso .meche { fill: none; stroke: var(--cheveux2); stroke-width: 6; stroke-linecap: round; opacity: .55; }
  #perso .joues ellipse { fill: var(--joue); opacity: .55; }
  #perso .f-col { fill: color-mix(in srgb, var(--sweat) 82%, #fff); }
  #perso .bouton { fill: color-mix(in srgb, var(--sweat) 60%, #fff); }
  #perso .boucle { fill: none; stroke: var(--cheveux2); stroke-width: 4; stroke-linecap: round; opacity: .5; }
  #perso .barbe { fill: var(--cheveux); opacity: .3; }
  #perso .barbe-fonce { fill: var(--cheveux); opacity: .6; }
  #perso .moustache { fill: var(--cheveux); opacity: .85; }
  #perso .monture { fill: url(#perso-verre); stroke: var(--trait); stroke-width: 9; stroke-linejoin: round; }
  #perso .branche { fill: none; stroke: var(--trait); stroke-width: 9; stroke-linecap: round; }
  #perso .reflet { fill: #fff; opacity: .16; }
  #perso .sc-c { fill: none; stroke: var(--trait); stroke-width: 25; stroke-linecap: round; }
  #perso .sc-f { fill: none; stroke: var(--cheveux); stroke-width: 13; stroke-linecap: round; }
  #perso .cordon-c { fill: none; stroke: var(--trait); stroke-width: 14; stroke-linecap: round; }
  #perso .cordon-b { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; }
  #perso .bras-contour { fill: none; stroke: var(--trait); stroke-width: 84; stroke-linecap: round; stroke-linejoin: round; }
  #perso .bras-tissu { fill: none; stroke: var(--sweat); stroke-width: 70; stroke-linecap: round; stroke-linejoin: round; }
  #perso .rayon-c { stroke: var(--trait); stroke-width: 21; stroke-linecap: round; }
  #perso .rayon { stroke: var(--jaune); stroke-width: 12; stroke-linecap: round; }
  #perso .goutte { fill: #fff; stroke: var(--trait); stroke-width: 4.5; stroke-linejoin: round; }
  #perso .goutte.bleue { fill: var(--bleu); }

  /* Pivots des pièces mobiles */
  #perso .tete { transform-box: view-box; transform-origin: 330px 470px; animation: hoche 3.6s ease-in-out infinite; }
  #perso .pup, #perso .ph, #perso .pb, #perso .sc { transform-box: view-box; transition: transform .16s ease-out; }
  #perso .pup-g, #perso .ph-g, #perso .pb-g { transform-origin: 276px 312px; }
  #perso .pup-d, #perso .ph-d, #perso .pb-d { transform-origin: 384px 312px; }
  #perso .sc-g { transform-origin: 275px 260px; }
  #perso .sc-d { transform-origin: 385px 260px; }
  #perso .ph { transform: translateY(8px); animation: cligne 4.2s infinite; }
  #perso .bouche { transform-box: view-box; transform-origin: 330px 396px; }
  #perso .main-ouverte { transform-box: view-box; transform-origin: 100px 470px; }
  #perso .main-pointe { transform-box: view-box; transform-origin: 100px 470px; }
  #perso .extra { transform-box: fill-box; transform-origin: center; animation: pop .38s cubic-bezier(.3, 1.6, .5, 1) both; }

  /* Tout est caché par défaut, chaque état allume ses pièces */
  #perso .bouche, #perso .bras, #perso .main-pointe, #perso .main-ouverte, #perso .extra, #perso .joues { display: none; }
  #perso[data-casque="non"] .casque, #perso[data-pin="non"] .pin, #perso[data-lunettes="non"] .lunettes,
  #perso[data-tenue="polo"] .tenue-sweat, #perso[data-tenue="sweat"] .tenue-polo,
  #perso[data-barbe="non"] .barbe, #perso[data-barbe="non"] .barbe-fonce, #perso[data-moustache="non"] .moustache { display: none; }
  #perso[data-trame="non"] > g { filter: none; }

  /* Lunettes de soleil : elles glissent sur le nez pour laisser voir les yeux quand l'émotion monte */
  #perso .lunettes { transform-box: view-box; transform-origin: 330px 310px; transition: transform .2s ease-out; }
  #perso[data-expr="sceptique"] .lunettes { transform: translateY(3px) rotate(-3deg); }
  #perso[data-expr="insiste"] .lunettes { transform: translateY(-3px); }
  #perso[data-expr="inquiet"] .lunettes { transform: translateY(5px) rotate(-2deg); }
  #perso[data-expr="question"] .lunettes { transform: rotate(3deg); }
  #perso[data-expr="surpris"] .lunettes, #perso[data-expr="panique"] .lunettes { transform: translateY(46px); }
  #perso[data-expr="malin"] .lunettes { transform: translateY(40px); }
  #perso[data-lunettes="oui"][data-expr="malin"] .ph { transform: translateY(16px); }
  #perso[data-lunettes="oui"][data-expr="malin"] .pup { transform: translate(2px, -4px); }
  #perso[data-parle="oui"] .anim { animation: parle .5s ease-in-out infinite alternate; }

  /* Poses */
  #perso[data-pose="croise"] .bras-croise,
  #perso[data-pose="pointe"] .bras-leve, #perso[data-pose="pointe"] .main-pointe,
  #perso[data-pose="salue"] .bras-leve, #perso[data-pose="salue"] .main-ouverte { display: inline; }
  #perso[data-pose="pointe"] .main-pointe { animation: insiste .9s ease-in-out infinite; }
  #perso[data-pose="salue"] .main-ouverte { animation: coucou 1.3s ease-in-out infinite; }

  /* neutre */
  #perso[data-expr="neutre"] .b-sourire { display: inline; }

  /* sceptique : regard en coin, sourire en coin */
  #perso[data-expr="sceptique"] .b-coin { display: inline; }
  #perso[data-expr="sceptique"] .pup { transform: translate(12px, 3px); }
  #perso[data-expr="sceptique"] .ph-g { transform: translateY(30px) rotate(-4deg); }
  #perso[data-expr="sceptique"] .ph-d { transform: translateY(27px) rotate(5deg); }
  #perso[data-expr="sceptique"] .sc-g { transform: translateY(-10px) rotate(-4deg); }
  #perso[data-expr="sceptique"] .sc-d { transform: translateY(7px) rotate(-12deg); }

  /* parle : explication neutre */
  #perso[data-expr="parle"] .b-parle { display: inline; }
  #perso[data-expr="parle"] .pup { transform: translate(0, 2px); }
  #perso[data-expr="parle"] .ph { transform: translateY(10px); }
  #perso[data-expr="parle"] .sc { transform: translateY(-4px); }

  /* insiste : il crie un peu, sourcil froncé */
  #perso[data-expr="insiste"] .b-grande { display: inline; }
  #perso[data-expr="insiste"] .pup { transform: translate(10px, 2px); }
  #perso[data-expr="insiste"] .ph-g { transform: translateY(24px) rotate(8deg); }
  #perso[data-expr="insiste"] .ph-d { transform: translateY(20px) rotate(-6deg); }
  #perso[data-expr="insiste"] .sc-g { transform: translateY(4px) rotate(10deg); }
  #perso[data-expr="insiste"] .sc-d { transform: translateY(2px) rotate(-14deg); }

  /* surpris : yeux ronds, traits jaunes, sueur */
  #perso[data-expr="surpris"] .b-plate,
  #perso[data-expr="surpris"] .x-rayons,
  #perso[data-expr="surpris"] .x-gouttes { display: inline; }
  #perso[data-expr="surpris"] .pup { transform: scale(.7); }
  #perso[data-expr="surpris"] .ph { transform: translateY(0); }
  #perso[data-expr="surpris"] .sc { transform: translateY(-16px); }

  /* content : yeux mi-clos, joues roses, étincelle */
  #perso[data-expr="content"] .b-sourire,
  #perso[data-expr="content"] .joues,
  #perso[data-expr="content"] .x-etincelle { display: inline; }
  #perso[data-expr="content"] .pup { transform: translate(0, 4px); }
  #perso[data-expr="content"] .ph { transform: translateY(20px); }
  #perso[data-expr="content"] .pb { transform: translateY(-16px); }
  #perso[data-expr="content"] .sc { transform: translateY(-6px); }

  /* inquiet : larmes, sourcils tristes */
  #perso[data-expr="inquiet"] .b-froncee,
  #perso[data-expr="inquiet"] .x-larmes,
  #perso[data-expr="inquiet"] .x-sueur { display: inline; }
  #perso[data-expr="inquiet"] .pup { transform: translate(0, 5px) scale(1.1); }
  #perso[data-expr="inquiet"] .ph-g { transform: translateY(14px) rotate(-12deg); }
  #perso[data-expr="inquiet"] .ph-d { transform: translateY(14px) rotate(12deg); }
  #perso[data-expr="inquiet"] .sc-g { transform: translateY(-6px) rotate(-16deg); }
  #perso[data-expr="inquiet"] .sc-d { transform: translateY(-6px) rotate(16deg); }

  /* panique : bouche grande ouverte, sueur partout */
  #perso[data-expr="panique"] .b-grande,
  #perso[data-expr="panique"] .x-gouttes,
  #perso[data-expr="panique"] .x-sueur { display: inline; }
  #perso[data-expr="panique"] .pup { transform: scale(.6); }
  #perso[data-expr="panique"] .ph { transform: translateY(0); }
  #perso[data-expr="panique"] .sc-g { transform: translateY(-18px) rotate(-8deg); }
  #perso[data-expr="panique"] .sc-d { transform: translateY(-18px) rotate(8deg); }

  /* malin : paupières lourdes, sourire en coin */
  #perso[data-expr="malin"] .b-coin { display: inline; }
  #perso[data-expr="malin"] .pup { transform: translate(2px, 8px); }
  #perso[data-expr="malin"] .ph { transform: translateY(34px); }
  #perso[data-expr="malin"] .pb { transform: translateY(-8px); }
  #perso[data-expr="malin"] .sc { transform: translateY(4px); }

  /* question : point d'interrogation, invite à commenter */
  #perso[data-expr="question"] .b-parle,
  #perso[data-expr="question"] .joues,
  #perso[data-expr="question"] .x-question { display: inline; }
  #perso[data-expr="question"] .pup { transform: translate(-4px, 0); }
  #perso[data-expr="question"] .ph { transform: translateY(16px); }
  #perso[data-expr="question"] .sc-g { transform: translateY(-12px); }
  #perso[data-expr="question"] .sc-d { transform: rotate(-6deg); }

  @keyframes cligne { 0%, 93%, 100% { translate: 0 0; } 96% { translate: 0 72px; } }
  @keyframes parle { 0% { scale: 1 .35; } 30% { scale: 1 1; } 55% { scale: 1 .6; } 80% { scale: 1 .95; } 100% { scale: 1 .45; } }
  @keyframes hoche { 0%, 100% { rotate: 0deg; translate: 0 0; } 50% { rotate: .8deg; translate: 0 2px; } }
  @keyframes pop { from { scale: .3; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes coucou { 0%, 100% { rotate: -7deg; } 50% { rotate: 7deg; } }
  @keyframes insiste { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
  @media (prefers-reduced-motion: reduce) {
    #perso * { animation: none !important; transition: none !important; }
  }
</style>
<defs>
  <!-- Ombre en trame de points décalée (effet Ben-Day), calculée entièrement dans le filtre :
       une tuile 10×10 avec un carré, répétée, arrondie (flou + seuil), découpée par la silhouette décalée -->
  <filter id="perso-trame" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1000" height="1200" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feFlood flood-opacity="0" x="0" y="0" width="10" height="10" result="fond"/>
    <feFlood flood-color="#161616" x="2.5" y="2.5" width="5" height="5" result="carre"/>
    <feMerge x="0" y="0" width="10" height="10" result="tuile"><feMergeNode in="fond"/><feMergeNode in="carre"/></feMerge>
    <feTile in="tuile" result="grille"/>
    <feGaussianBlur in="grille" stdDeviation="1.1" result="flou"/>
    <feComponentTransfer in="flou" result="points"><feFuncA type="discrete" tableValues="0 0 1 1"/></feComponentTransfer>
    <feOffset in="SourceAlpha" dx="18" dy="10" result="decale"/>
    <feComposite in="points" in2="decale" operator="in" result="ombre"/>
    <feMerge><feMergeNode in="ombre"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

<script>
  const FORMATS = {
    '9:16': { W: 1080, H: 1920, nom: '9:16 vidéo' },
    '16:9': { W: 1280, H: 720, nom: '16:9 YouTube' },
    '1:1': { W: 1080, H: 1080, nom: '1:1 carré' },
  };
  const PALETTE = ['#141414', '#E0402A', '#F6C21C', '#7CC8F2', '#FFFFFF', '#6B675F', '#F1EEE8'];
  const FONDS = [['points', 'Points'], ['uni', 'Uni'], ['quadrille', 'Quadrillé'], ['ligne', 'Cahier'], ['rayons', 'Rayons'], ['image', 'Image']];
  const TAILLE_MOTIF = { points: 36, quadrille: 60, ligne: 48 };
  const FOND_PRESETS = [
    ['#F1EEE8', '#CFC9BE', 'Papier'], ['#FBF8F1', '#9CC3E6', 'Cahier'], ['#141414', '#323232', 'Encre'], ['#E0402A', '#C9361F', 'Rouge'],
    ['#F6C21C', '#E2AC0B', 'Jaune'], ['#7CC8F2', '#5DB2E2', 'Bleu'], ['#FFFFFF', '#E4E0D8', 'Blanc'],
  ];
  const EXPRESSIONS = ['neutre', 'sceptique', 'parle', 'insiste', 'surpris', 'content', 'inquiet', 'panique', 'malin', 'question'];
  const POSES = ['repos', 'croise', 'pointe', 'salue'];
  const OPTIONS_PERSO = [
    ['parle', 'Bouche animée', 'oui', 'non'], ['lunettes', 'Lunettes de soleil', 'oui', 'non'], ['tenue', 'Sweat à capuche (au lieu du polo)', 'sweat', 'polo'],
    ['casque', 'Casque au cou', 'oui', 'non'], ['pin', 'Pin', 'oui', 'non'], ['barbe', 'Barbe', 'oui', 'non'],
    ['moustache', 'Moustache', 'oui', 'non'], ['trame', 'Ombre en points', 'oui', 'non'],
  ];
  const COULEURS_PERSO = [['--cheveux', '#17110E', 'Cheveux'], ['--sweat', '#2A2A2E', 'Haut'], ['--peau', '#B9805A', 'Peau'], ['--rouge', '#E0402A', 'Accent']];
  // texte : a un texte · auto : largeur selon le texte · dessin : a une hauteur propre
  const TYPES = {
    perso: { nom: 'Présentateur' }, titre: { nom: 'Titre', texte: true }, texte: { nom: 'Texte', texte: true },
    label: { nom: 'Label', texte: true, auto: true }, pastille: { nom: 'Mot clé', texte: true, auto: true },
    carte: { nom: 'Carte', texte: true }, bulle: { nom: 'Bulle', texte: true }, tampon: { nom: 'Tampon', texte: true, dessin: true },
    etoile: { nom: 'Étoile', dessin: true }, fleche: { nom: 'Flèche', dessin: true }, forme: { nom: 'Forme', dessin: true }, image: { nom: 'Image', dessin: true },
  };
  const AJOUTS = [['titre', 'Titre'], ['texte', 'Texte'], ['label', 'Label //'], ['pastille', 'Mot clé'], ['carte', 'Carte'], ['bulle', 'Bulle'],
    ['tampon', 'Tampon'], ['etoile', 'Étoile'], ['fleche', 'Flèche'], ['rond', 'Rond'], ['rect', 'Rectangle'], ['image', 'Image…'], ['perso', 'Présentateur']];
  const ETOILE = 'M60 6 L75 42 L114 45 L84 70 L94 108 L60 87 L26 108 L36 70 L6 45 L45 42 Z';
  const QUEUE = '<svg class="queue" viewBox="0 0 70 52"><path d="M 4 0 L 16 48 L 58 0 Z" fill="#fff"/><path d="M 4 2 L 16 48 L 58 2" fill="none" stroke="#141414" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  const SEQUENCE = [
    ['sceptique', 'croise'], ['parle', 'croise'], ['surpris', 'pointe'], ['content', 'salue'], ['insiste', 'pointe'], ['surpris', 'repos'],
    ['inquiet', 'salue'], ['inquiet', 'croise'], ['panique', 'salue'], ['insiste', 'croise'], ['malin', 'pointe'], ['question', 'salue'],
  ];
  const CLE = 'presentateur-studio-v2';

  const $ = s => document.querySelector(s);
  const scene = $('#scene'), porte = $('#porte'), PERSO = document.getElementById('perso');
  let etat, sel = null, s = 1, geste = null, historique = [], pos = -1, minuteurs = [], cibleImage = null, attente = null;

  const S = () => etat.scenes[etat.format];
  const trouver = id => S().elements.find(e => e.id === id);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const k = () => Math.min(FORMATS[etat.format].W, FORMATS[etat.format].H) / 1080;
  const hauteur = e => e.type === 'perso' ? e.w * 1.3 : (e.h || 0);
  const echapper = t => String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const balisage = t => echapper(t).replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\[(.+?)\]/g, '<span class="k">$1</span>').replace(/\n/g, '<br>');
  function clair(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 150; }
  function toast(t) { const n = $('#toast'); n.textContent = t; n.classList.add('on'); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('on'), 2200); }

  /* ---------- État, historique, sauvegarde ---------- */

  function persoDefaut(W, H) {
    const w = Math.round(Math.min(W * 0.7, H * 0.55));
    return { id: uid(), type: 'perso', x: Math.round(W - w + w * 0.086), y: Math.round(H - w * 1.3), w, rot: 0, op: 1,
      expr: 'sceptique', pose: 'croise', parle: 'oui', lunettes: 'oui', tenue: 'polo', casque: 'non', pin: 'non',
      barbe: 'oui', moustache: 'oui', trame: 'oui', couleurs: {}, miroir: false };
  }
  function sceneDefaut() {
    return {
      fond: { type: 'points', couleur: '#F1EEE8', motif: '#CFC9BE', taille: 36, image: null, voile: 0, flou: 0 },
      elements: [
        { id: uid(), type: 'label', x: 76, y: 118, rot: 0, op: 1, couleur: '#6B675F', texte: '// 00 — perso', taille: 34 },
        { id: uid(), type: 'titre', x: 76, y: 186, w: 930, rot: 0, op: 1, couleur: '#141414', texte: 'Ton présentateur,\n*en code.*', taille: 98 },
        persoDefaut(1080, 1920),
      ],
    };
  }
  const etatDefaut = () => ({ format: '9:16', scenes: { '9:16': sceneDefaut() } });

  // Première ouverture d'un format : on reprend la scène actuelle, recadrée
  function adapter(src, de, vers) {
    const A = FORMATS[de], B = FORMATS[vers], rx = B.W / A.W, ry = B.H / A.H, r = Math.sqrt(rx * ry);
    const sc = JSON.parse(JSON.stringify(src));
    sc.elements.forEach(e => {
      // les textes gardent leur bord gauche, le reste garde son centre
      const ancre = TYPES[e.type].texte && !TYPES[e.type].dessin ? 0 : 0.5;
      const cx = (e.x + (e.w || 0) * ancre) * rx, cy = (e.y + hauteur(e) * ancre) * ry;
      if (e.w) e.w = Math.round(e.w * r);
      if (e.h) e.h = Math.round(e.h * r);
      if (e.taille) e.taille = Math.round(e.taille * r);
      e.x = Math.round(cx - (e.w || 0) * ancre);
      e.y = Math.round(cy - hauteur(e) * ancre);
    });
    return sc;
  }

  function sauver(txt) {
    try { localStorage.setItem(CLE, txt); }
    catch (_) { toast('Sauvegarde auto impossible (image trop lourde) : utilise « Enregistrer .json »'); }
  }
  function charger() {
    try {
      const o = JSON.parse(localStorage.getItem(CLE));
      if (o && o.scenes && o.scenes[o.format]) return o;
    } catch (_) {}
    return etatDefaut();
  }
  function commit() {
    clearTimeout(attente);
    const txt = JSON.stringify(etat);
    if (historique[pos] === txt) return;
    historique = historique.slice(0, pos + 1);
    historique.push(txt);
    if (historique.length > 100) historique.shift();
    pos = historique.length - 1;
    sauver(txt);
    majHistorique();
  }
  function commitPlusTard() { clearTimeout(attente); attente = setTimeout(() => { commit(); rendrePanneaux(); }, 400); }
  function voyager(pas) {
    const p = pos + pas;
    if (p < 0 || p >= historique.length) return;
    pos = p;
    etat = JSON.parse(historique[pos]);
    if (sel && !trouver(sel)) sel = null;
    sauver(historique[pos]);
    majHistorique();
    toutRendre();
  }
  function majHistorique() { $('#annuler').disabled = pos <= 0; $('#retablir').disabled = pos >= historique.length - 1; }

  /* ---------- Rendu de la scène ---------- */

  function cssFond(f, W) {
    const c = f.couleur, m = f.motif, t = f.taille;
    switch (f.type) {
      case 'points': { const r = Math.max(1.2, t * 0.085); return `background-color:${c};background-image:radial-gradient(${m} ${r}px, transparent ${r + 0.6}px);background-size:${t}px ${t}px;background-position:${t / 2}px ${t / 2}px`; }
      case 'quadrille': return `background-color:${c};background-image:linear-gradient(${m} 2px, transparent 2px),linear-gradient(90deg, ${m} 2px, transparent 2px);background-size:${t}px ${t}px`;
      case 'ligne': { const x = Math.round(W * 0.12); return `background-color:${c};background-image:linear-gradient(90deg, transparent ${x}px, #E0402Acc ${x}px ${x + 4}px, transparent ${x + 4}px),repeating-linear-gradient(transparent 0 ${t - 2}px, ${m} ${t - 2}px ${t}px)`; }
      case 'rayons': return `background:repeating-conic-gradient(from 0deg at 50% 62%, ${c} 0deg 9deg, ${m} 9deg 18deg)`;
      default: return `background-color:${c}`;
    }
  }
  function noeudFond(f, W) {
    const g = document.createElement('div');
    g.className = 'fond';
    g.style.cssText = cssFond(f, W);
    if (f.type === 'image' && f.image) {
      const i = document.createElement('div');
      i.className = 'fond-img';
      i.style.backgroundImage = `url("${f.image}")`;
      if (f.flou) { i.style.filter = `blur(${f.flou}px)`; i.style.inset = `${-f.flou * 2}px`; }
      g.appendChild(i);
      if (f.voile) {
        const v = document.createElement('div');
        v.className = 'voile';
        v.style.background = f.couleur;
        v.style.opacity = f.voile / 100;
        g.appendChild(v);
      }
    }
    return g;
  }

  function svgTampon(e) {
    const [a = '', b = ''] = String(e.texte || '').split('\n');
    const serre = (txt, max) => txt.length > max ? ` textLength="250" lengthAdjust="spacingAndGlyphs"` : '';
    const textes = b
      ? `<text x="165" y="150" text-anchor="middle" font-family="Inter" font-weight="800" font-size="46" fill="currentColor" letter-spacing="1"${serre(a, 9)}>${echapper(a)}</text>
         <text x="165" y="214" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="64" fill="currentColor"${serre(b, 11)}>${echapper(b)}</text>`
      : `<text x="165" y="184" text-anchor="middle" font-family="Inter" font-weight="800" font-size="52" fill="currentColor"${serre(a, 8)}>${echapper(a)}</text>`;
    return `<svg class="dessin" viewBox="0 0 330 330" style="color:${e.couleur}"><circle cx="165" cy="165" r="150" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="10"/><circle cx="165" cy="165" r="124" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="10 9"/>${textes}</svg>`;
  }

  function placer(d, e) {
    const t = TYPES[e.type];
    d.style.left = e.x + 'px';
    d.style.top = e.y + 'px';
    d.style.transform = e.rot ? `rotate(${e.rot}deg)` : '';
    d.style.opacity = e.op ?? 1;
    if (e.taille) d.style.fontSize = e.taille + 'px';
    if (!t.auto) d.style.width = e.w + 'px';
    if (e.type === 'perso' || t.dessin) d.style.height = Math.round(hauteur(e)) + 'px';
  }

  function appliquerPerso(e) {
    ['expr', 'pose', 'parle', 'lunettes', 'tenue', 'casque', 'pin', 'barbe', 'moustache', 'trame'].forEach(c => PERSO.dataset[c] = e[c]);
    COULEURS_PERSO.forEach(([v]) => { const c = e.couleurs && e.couleurs[v]; c ? PERSO.style.setProperty(v, c) : PERSO.style.removeProperty(v); });
    PERSO.style.transform = e.miroir ? 'scaleX(-1)' : '';
  }

  function noeud(e) {
    const d = document.createElement('div');
    d.className = `el el-${e.type}` + (e.id === sel ? ' sel' : '');
    d.dataset.id = e.id;
    placer(d, e);
    switch (e.type) {
      case 'perso': appliquerPerso(e); d.appendChild(PERSO); break;
      case 'titre': case 'texte': case 'label':
        d.classList.add('txt'); d.style.color = e.couleur; d.innerHTML = balisage(e.texte); break;
      case 'carte': case 'bulle':
        d.innerHTML = `<div class="boite txt" style="color:${e.couleur}">${balisage(e.texte)}</div>` + (e.type === 'bulle' ? QUEUE : ''); break;
      case 'pastille':
        d.innerHTML = `<div class="boite" style="background:${e.couleur};color:${clair(e.couleur) ? '#141414' : '#fff'}">${balisage(e.texte)}</div>`; break;
      case 'tampon': d.innerHTML = svgTampon(e); break;
      case 'etoile':
        d.innerHTML = `<svg class="dessin" viewBox="-6 -6 138 138"><path d="${ETOILE}" transform="translate(7 7)" fill="#141414" stroke="#141414" stroke-width="6" stroke-linejoin="round"/><path d="${ETOILE}" fill="${e.couleur}" stroke="#141414" stroke-width="6" stroke-linejoin="round"/></svg>`; break;
      case 'fleche': {
        const p = 'M 16 96 C 80 22 170 18 262 58 M 218 22 L 266 60 L 214 96';
        d.innerHTML = `<svg class="dessin" viewBox="0 0 300 120" style="overflow:visible"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${p}" stroke="#141414" stroke-width="28"/><path d="${p}" stroke="${e.couleur}" stroke-width="14"/></g></svg>`; break;
      }
      case 'forme':
        d.innerHTML = `<div class="boite" style="background:${e.couleur};border-radius:${e.forme === 'rond' ? '50%' : '28px'};${e.bordure ? 'border:5px solid #141414' : ''}"></div>`; break;
      case 'image':
        d.innerHTML = `<img src="${e.src}" alt="" draggable="false" style="${e.miroir ? 'transform:scaleX(-1)' : ''}">`; break;
    }
    if (e.id === sel) d.insertAdjacentHTML('beforeend', '<i class="poignee p-rot" data-p="rot" title="Rotation"></i><i class="poignee p-taille" data-p="taille" title="Taille"></i>');
    return d;
  }

  function noeudZones() {
    const { W, H } = FORMATS[etat.format];
    const zones = {
      '9:16': [[0, 0, W, 150, 'haut de l\'appli'], [W - 150, 640, 150, 800, 'boutons'], [0, H - 420, W - 150, 420, 'pseudo + légende']],
      '16:9': [[W - 180, H - 76, 164, 60, 'durée']],
      '1:1': [],
    }[etat.format];
    const z = document.createElement('div');
    z.className = 'aide-ui';
    z.innerHTML = zones.map(([x, y, w, h, t]) => `<div class="zone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${t}</div>`).join('');
    return z;
  }

  function guides(v, h) {
    scene.querySelectorAll('.guide').forEach(n => n.remove());
    const { W, H } = FORMATS[etat.format];
    if (v) scene.insertAdjacentHTML('beforeend', `<div class="aide-ui guide guide-v" style="left:${W / 2 - 1}px"></div>`);
    if (h) scene.insertAdjacentHTML('beforeend', `<div class="aide-ui guide guide-h" style="top:${H / 2 - 1}px"></div>`);
  }

  function echelle() {
    const { W, H } = FORMATS[etat.format];
    const aw = $('#cadre').clientWidth;
    const ah = Math.max(320, innerHeight - (innerWidth > 1100 ? 120 : 160));
    s = Math.min(aw / W, ah / H);
    porte.style.width = W * s + 'px';
    porte.style.height = H * s + 'px';
    scene.style.transform = `scale(${s})`;
    scene.style.setProperty('--inv', 1 / s);
  }

  function rendre() {
    const { W, H } = FORMATS[etat.format];
    scene.style.width = W + 'px';
    scene.style.height = H + 'px';
    scene.replaceChildren(noeudFond(S().fond, W), ...S().elements.map(noeud));
    if ($('#zones').checked) scene.appendChild(noeudZones());
    echelle();
  }

  /* ---------- Panneau de gauche : format, fond, ajouts, calques ---------- */

  function bouton(texte, action, classe) {
    const b = document.createElement('button');
    b.textContent = texte;
    if (classe) b.className = classe;
    b.addEventListener('click', action);
    return b;
  }

  function construireGauche() {
    Object.entries(FORMATS).forEach(([f, o]) => {
      const b = bouton(o.nom, () => changerFormat(f));
      b.dataset.v = f;
      $('#formats').appendChild(b);
    });
    FONDS.forEach(([v, nom]) => {
      const b = bouton(nom, () => {
        const f = S().fond;
        f.type = v;
        if (TAILLE_MOTIF[v]) f.taille = TAILLE_MOTIF[v];
        if (v === 'ligne' && f.couleur === '#F1EEE8') { f.couleur = '#FBF8F1'; f.motif = '#9CC3E6'; }
        if (v === 'image' && !f.image) { cibleImage = 'fond'; $('#fichier-image').click(); }
        commit(); rendre(); rendreGauche();
      });
      b.dataset.v = v;
      $('#fonds').appendChild(b);
    });
    FOND_PRESETS.forEach(([c, m, nom]) => {
      const b = bouton('', () => { Object.assign(S().fond, { couleur: c, motif: m }); commit(); rendre(); rendreGauche(); });
      b.title = nom;
      b.style.background = c;
      b.dataset.v = c;
      $('#fond-presets').appendChild(b);
    });
    [['fond-couleur', 'couleur'], ['fond-motif', 'motif'], ['fond-taille', 'taille'], ['fond-voile', 'voile'], ['fond-flou', 'flou']].forEach(([id, cle]) => {
      const i = document.getElementById(id);
      i.addEventListener('input', () => { S().fond[cle] = i.type === 'range' ? +i.value : i.value; rendre(); majSorties(); });
      i.addEventListener('change', () => { commit(); rendreGauche(); });
    });
    $('#fond-importer').addEventListener('click', () => { cibleImage = 'fond'; $('#fichier-image').click(); });
    AJOUTS.forEach(([v, nom]) => $('#ajouts').appendChild(bouton(nom, () => ajouter(v))));
  }

  function majSorties() {
    const f = S().fond;
    $('#o-fond-taille').textContent = f.taille + ' px';
    $('#o-fond-voile').textContent = (f.voile || 0) + ' %';
    $('#o-fond-flou').textContent = (f.flou || 0) + ' px';
  }

  function rendreGauche() {
    const f = S().fond;
    document.querySelectorAll('#formats button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === etat.format));
    document.querySelectorAll('#fonds button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === f.type));
    document.querySelectorAll('#fond-presets button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v.toLowerCase() === f.couleur.toLowerCase()));
    $('#fond-couleur').value = f.couleur;
    $('#fond-motif').value = f.motif;
    $('#fond-taille').value = f.taille;
    $('#fond-voile').value = f.voile || 0;
    $('#fond-flou').value = f.flou || 0;
    majSorties();
    document.querySelectorAll('.si-motif').forEach(n => n.classList.toggle('cache', !['points', 'quadrille', 'ligne', 'rayons'].includes(f.type)));
    $('#fond-taille').closest('label').classList.toggle('cache', !TAILLE_MOTIF[f.type]);
    $('.si-image').classList.toggle('cache', f.type !== 'image');

    const liste = $('#calques');
    liste.replaceChildren(...S().elements.slice().reverse().map(e => {
      const li = document.createElement('li');
      const extrait = String(e.texte || '').replace(/[*\[\]\n]/g, ' ').replace(/\s+/g, ' ').trim();
      const b = bouton(extrait ? `${TYPES[e.type].nom} — ${extrait}` : TYPES[e.type].nom, () => choisir(e.id));
      b.setAttribute('aria-pressed', e.id === sel);
      li.appendChild(b);
      return li;
    }));
  }

  /* ---------- Panneau de droite : réglages de l'élément choisi ---------- */

  function groupe(titre, ...enfants) {
    const g = document.createElement('div');
    g.className = 'groupe';
    g.innerHTML = `<h2>${titre}</h2>`;
    enfants.forEach(n => g.appendChild(n));
    return g;
  }
  function rangee(...enfants) { const d = document.createElement('div'); d.className = 'boutons'; enfants.forEach(n => d.appendChild(n)); return d; }
  function curseur(nom, min, max, valeur, unite, surInput) {
    const l = document.createElement('label');
    l.className = 'curseur';
    l.innerHTML = `<span>${nom} <output>${Math.round(valeur)}${unite}</output></span><input type="range" min="${min}" max="${max}" value="${valeur}">`;
    const i = l.querySelector('input'), o = l.querySelector('output');
    i.addEventListener('input', () => { surInput(+i.value); o.textContent = i.value + unite; rendre(); });
    i.addEventListener('change', () => commit());
    return l;
  }
  function caseACocher(nom, coche, surChange) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox"${coche ? ' checked' : ''}> ${nom}`;
    l.querySelector('input').addEventListener('change', ev => { surChange(ev.target.checked); commit(); rendre(); });
    return l;
  }
  function nuancier(valeur, surChoix) {
    const n = document.createElement('div');
    n.className = 'nuancier';
    PALETTE.forEach(c => {
      const b = bouton('', () => { surChoix(c); commit(); rendre(); rendreProprietes(); });
      b.style.background = c;
      b.title = c;
      b.setAttribute('aria-pressed', c.toLowerCase() === String(valeur).toLowerCase());
      n.appendChild(b);
    });
    const i = document.createElement('input');
    i.type = 'color';
    i.value = valeur;
    i.title = 'Autre couleur';
    i.addEventListener('input', () => { surChoix(i.value); rendre(); });
    i.addEventListener('change', () => commit());
    n.appendChild(i);
    return n;
  }

  function rendreProprietes() {
    const P = $('#proprietes');
    P.replaceChildren();
    const e = sel && trouver(sel);
    if (!e) {
      P.innerHTML = `<div class="groupe"><h2>// Sélection</h2><p class="vide">Clique un élément sur la scène pour le modifier, le déplacer ou l'effacer.<br><br>Pour ajouter un texte, une forme ou une image : colonne de gauche, « Ajouter ». Pour le fond : « Arrière-plan ».</p></div>
        <div class="groupe"><h2>// Raccourcis</h2><p class="astuce">Suppr : effacer<br>Ctrl+D : dupliquer<br>Ctrl+Z / Ctrl+Y : annuler / rétablir<br>Flèches : déplacer (Maj = ×10)<br>Maj + rotation : par pas de 15°<br>Échap : désélectionner</p></div>`;
      return;
    }
    const t = TYPES[e.type];

    P.appendChild(groupe(`// ${t.nom}`, rangee(
      bouton('Dupliquer', dupliquer), bouton('Devant', () => ordre(1)), bouton('Derrière', () => ordre(-1)),
      bouton('Centrer', centrer), bouton('Supprimer', supprimer, 'danger'),
    )));

    if (e.type === 'perso') {
      const exprs = rangee(...EXPRESSIONS.map(v => { const b = bouton(v, () => { arreterDemo(); e.expr = v; commit(); rendre(); rendreProprietes(); }); b.setAttribute('aria-pressed', e.expr === v); b.dataset.expr = v; return b; }));
      const poses = rangee(...POSES.map(v => { const b = bouton(v, () => { arreterDemo(); e.pose = v; commit(); rendre(); rendreProprietes(); }); b.setAttribute('aria-pressed', e.pose === v); b.dataset.pose = v; return b; }));
      P.appendChild(groupe('// Expression', exprs));
      P.appendChild(groupe('// Pose', poses));
      const opts = document.createElement('div');
      opts.className = 'options';
      OPTIONS_PERSO.forEach(([cle, nom, oui, non]) => opts.appendChild(caseACocher(nom, e[cle] === oui, c => e[cle] = c ? oui : non)));
      opts.appendChild(caseACocher('Miroir (regarde de l\'autre côté)', e.miroir, c => e.miroir = c));
      P.appendChild(groupe('// Ce qu\'il porte', opts));
      const coul = document.createElement('div');
      coul.className = 'ligne-reglage';
      COULEURS_PERSO.forEach(([v, def, nom]) => {
        const l = document.createElement('label');
        l.innerHTML = `<input type="color" value="${(e.couleurs && e.couleurs[v]) || def}"> ${nom}`;
        const i = l.querySelector('input');
        i.addEventListener('input', () => { e.couleurs = e.couleurs || {}; e.couleurs[v] = i.value; appliquerPerso(e); });
        i.addEventListener('change', () => commit());
        coul.appendChild(l);
      });
      P.appendChild(groupe('// Couleurs', coul));
      P.appendChild(groupe('// Actions', rangee(bouton('▶ Rejouer le jeu d\'acteur', () => demo(e), 'principal'), bouton('Télécharger le SVG', telechargerSVG))));
    }

    if (t.texte) {
      const ta = document.createElement('textarea');
      ta.value = e.texte || '';
      ta.addEventListener('input', () => { e.texte = ta.value; rendre(); });
      ta.addEventListener('change', () => { commit(); rendreGauche(); });
      const astuce = document.createElement('p');
      astuce.className = 'astuce';
      astuce.innerHTML = e.type === 'tampon' ? '1re ligne en gras, 2e ligne en italique.' : '*mot* → italique rouge<br>[mot] → surligné rouge<br>Entrée → nouvelle ligne';
      P.appendChild(groupe('// Texte', ta, astuce));
    }

    if (e.couleur) {
      const nom = { carte: 'Couleur du texte', bulle: 'Couleur du texte', pastille: 'Couleur du bloc' }[e.type] || 'Couleur';
      P.appendChild(groupe(`// ${nom}`, nuancier(e.couleur, c => e.couleur = c)));
    }

    if (e.type === 'forme') {
      const f = rangee(...[['rond', 'Rond'], ['rect', 'Rectangle']].map(([v, nom]) => {
        const b = bouton(nom, () => { e.forme = v; if (v === 'rond') e.h = e.w; commit(); rendre(); rendreProprietes(); });
        b.setAttribute('aria-pressed', e.forme === v);
        return b;
      }));
      const opts = document.createElement('div');
      opts.className = 'options';
      opts.style.marginTop = '10px';
      opts.appendChild(caseACocher('Contour noir', e.bordure, c => e.bordure = c));
      P.appendChild(groupe('// Forme', f, opts));
    }

    if (e.type === 'image') {
      const opts = document.createElement('div');
      opts.className = 'options';
      opts.appendChild(caseACocher('Miroir', e.miroir, c => e.miroir = c));
      P.appendChild(groupe('// Image', rangee(bouton('Remplacer l\'image…', () => { cibleImage = e.id; $('#fichier-image').click(); })), opts));
    }

    const { W } = FORMATS[etat.format];
    const reglages = [];
    if (e.taille) {
      reglages.push(curseur('Taille du texte', 12, 320, e.taille, ' px', v => {
        if (e.w && !t.auto) e.w = Math.round(e.w * v / e.taille);
        e.taille = v;
      }));
    } else {
      reglages.push(curseur('Largeur', 30, Math.round(W * 1.6), e.w, ' px', v => {
        if (e.h && !(e.type === 'forme' && e.forme === 'rect')) e.h = Math.round(e.h * v / e.w);
        e.w = v;
      }));
    }
    if (e.type === 'titre' || e.type === 'texte' || e.type === 'carte' || e.type === 'bulle') {
      reglages.push(curseur('Largeur du bloc', 120, Math.round(W * 1.2), e.w, ' px', v => e.w = v));
    }
    if (e.type === 'forme' && e.forme === 'rect') reglages.push(curseur('Hauteur', 30, Math.round(W * 1.6), e.h, ' px', v => e.h = v));
    reglages.push(curseur('Rotation', -180, 180, e.rot || 0, '°', v => e.rot = v));
    reglages.push(curseur('Opacité', 10, 100, Math.round((e.op ?? 1) * 100), ' %', v => e.op = v / 100));
    P.appendChild(groupe('// Réglages', ...reglages));
  }

  function rendrePanneaux() { rendreGauche(); rendreProprietes(); }
  function toutRendre() { rendre(); rendrePanneaux(); }

  /* ---------- Actions ---------- */

  function choisir(id) { sel = id; toutRendre(); }

  function changerFormat(f) {
    if (f === etat.format) return;
    if (!etat.scenes[f]) etat.scenes[f] = adapter(S(), etat.format, f);
    etat.format = f;
    sel = null;
    commit();
    toutRendre();
    toast(`Format ${FORMATS[f].nom} : chaque format garde sa propre scène`);
  }

  function ajouter(type) {
    const { W, H } = FORMATS[etat.format], q = k();
    let e = { id: uid(), type, rot: 0, op: 1 };
    switch (type) {
      case 'titre': Object.assign(e, { w: Math.round(900 * q), taille: Math.round(96 * q), couleur: '#141414', texte: 'Ton *titre* ici' }); break;
      case 'texte': Object.assign(e, { w: Math.round(700 * q), taille: Math.round(44 * q), couleur: '#141414', texte: 'Un texte simple, sur une ou deux lignes.' }); break;
      case 'label': Object.assign(e, { taille: Math.round(34 * q), couleur: '#6B675F', texte: '// 01 — étape' }); break;
      case 'pastille': Object.assign(e, { taille: Math.round(64 * q), couleur: '#E0402A', texte: 'MOT CLÉ' }); break;
      case 'carte': Object.assign(e, { w: Math.round(640 * q), taille: Math.round(56 * q), couleur: '#141414', texte: 'Une carte *importante*' }); break;
      case 'bulle': Object.assign(e, { w: Math.round(560 * q), taille: Math.round(56 * q), couleur: '#141414', texte: 'Tu bloques où ?' }); break;
      case 'tampon': Object.assign(e, { w: Math.round(320 * q), h: Math.round(320 * q), rot: -14, couleur: '#E0402A', texte: '4 ÉTAPES\ntrès bien !' }); break;
      case 'etoile': Object.assign(e, { w: Math.round(170 * q), h: Math.round(170 * q), rot: 12, couleur: '#F6C21C' }); break;
      case 'fleche': Object.assign(e, { w: Math.round(320 * q), h: Math.round(128 * q), couleur: '#E0402A' }); break;
      case 'rond': Object.assign(e, { type: 'forme', forme: 'rond', w: Math.round(260 * q), h: Math.round(260 * q), couleur: '#F6C21C', bordure: true }); break;
      case 'rect': Object.assign(e, { type: 'forme', forme: 'rect', w: Math.round(440 * q), h: Math.round(260 * q), couleur: '#7CC8F2', bordure: true }); break;
      case 'image': cibleImage = 'nouvelle'; $('#fichier-image').click(); return;
      case 'perso': {
        const deja = S().elements.find(x => x.type === 'perso');
        if (deja) { toast('Le présentateur est déjà sur la scène'); choisir(deja.id); return; }
        e = persoDefaut(W, H);
        break;
      }
    }
    if (e.x === undefined) {
      const n = S().elements.length % 5, w = e.w || 300 * q, h = hauteur(e) || 120 * q;
      e.x = Math.round(W / 2 - w / 2 + (n - 2) * 40 * q);
      e.y = Math.round(H * 0.4 - h / 2 + (n - 2) * 70 * q);
    }
    S().elements.push(e);
    sel = e.id;
    commit();
    toutRendre();
  }

  function supprimer() {
    const e = trouver(sel);
    if (!e) return;
    S().elements = S().elements.filter(x => x.id !== sel);
    sel = null;
    commit();
    toutRendre();
    toast(`${TYPES[e.type].nom} effacé · Ctrl+Z pour annuler`);
  }

  function dupliquer() {
    const e = trouver(sel);
    if (!e) return;
    if (e.type === 'perso') { toast('Un seul présentateur par scène'); return; }
    const c = { ...JSON.parse(JSON.stringify(e)), id: uid(), x: e.x + 30, y: e.y + 30 };
    S().elements.splice(S().elements.indexOf(e) + 1, 0, c);
    sel = c.id;
    commit();
    toutRendre();
  }

  function ordre(pas) {
    const l = S().elements, i = l.findIndex(x => x.id === sel), j = i + pas;
    if (i < 0 || j < 0 || j >= l.length) return;
    [l[i], l[j]] = [l[j], l[i]];
    commit();
    toutRendre();
  }

  function centrer() {
    const e = trouver(sel), d = scene.querySelector(`.el[data-id="${sel}"]`);
    if (!e || !d) return;
    e.x = Math.round(FORMATS[etat.format].W / 2 - d.offsetWidth / 2);
    commit();
    toutRendre();
  }

  function arreterDemo() { minuteurs.forEach(clearTimeout); minuteurs = []; }
  function demo(e) {
    arreterDemo();
    SEQUENCE.forEach(([expr, pose], i) => minuteurs.push(setTimeout(() => {
      e.expr = expr;
      e.pose = pose;
      appliquerPerso(e);
      document.querySelectorAll('[data-expr]').forEach(b => b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', b.dataset.expr === expr));
      document.querySelectorAll('[data-pose]').forEach(b => b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', b.dataset.pose === pose));
      if (i === SEQUENCE.length - 1) commit();
    }, i * 1600)));
  }

  function telecharger(blob, nom) {
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: nom }).click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function telechargerSVG() {
    telecharger(new Blob([new XMLSerializer().serializeToString(PERSO)], { type: 'image/svg+xml' }), `personnage-${PERSO.dataset.expr}-${PERSO.dataset.pose}.svg`);
  }

  // Export PNG en pleine résolution : la scène est recopiée dans un SVG (foreignObject) avec ses styles et ses polices
  async function rendrePNG() {
    const { W, H } = FORMATS[etat.format];
    const clone = scene.cloneNode(true);
    clone.querySelectorAll('.poignee, .aide-ui').forEach(n => n.remove());
    clone.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
    clone.style.transform = 'none';
    const css = $('#css-polices').textContent + $('#css-scene').textContent
      + '#scene .el { cursor: auto; } #scene #perso, #scene #perso * { animation: none !important; transition: none !important; }';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">`
      + `<div xmlns="http://www.w3.org/1999/xhtml"><style>${css.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</style>${new XMLSerializer().serializeToString(clone)}</div></foreignObject></svg>`;
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    await new Promise(r => setTimeout(r, 120));
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    await new Promise(r => setTimeout(r, 60));
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0);
    return c;
  }
  async function exporterPNG() {
    const b = $('#png');
    b.disabled = true;
    b.textContent = 'Export…';
    try {
      const c = await rendrePNG();
      c.toBlob(blob => telecharger(blob, `presentateur-${etat.format.replace(':', 'x')}.png`), 'image/png');
      toast(`PNG ${FORMATS[etat.format].W}×${FORMATS[etat.format].H} téléchargé`);
    } catch (err) {
      console.error(err);
      toast('Export impossible dans ce navigateur : essaie Chrome');
    } finally {
      b.disabled = false;
      b.textContent = 'Télécharger PNG';
    }
  }

  // Les images importées sont réduites (2000 px max) pour garder la sauvegarde légère
  function lireImage(fichier) {
    return new Promise((ok, ko) => {
      const r = new FileReader();
      r.onerror = ko;
      r.onload = () => {
        const img = new Image();
        img.onerror = ko;
        img.onload = () => {
          const f = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * f));
          c.height = Math.max(1, Math.round(img.naturalHeight * f));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          ok({ src: c.toDataURL('image/webp', 0.9), w: c.width, h: c.height });
        };
        img.src = r.result;
      };
      r.readAsDataURL(fichier);
    });
  }

  $('#fichier-image').addEventListener('change', async ev => {
    const fichier = ev.target.files[0];
    ev.target.value = '';
    if (!fichier) return;
    let im;
    try { im = await lireImage(fichier); } catch (_) { toast('Image illisible'); return; }
    const { W, H } = FORMATS[etat.format];
    if (cibleImage === 'fond') {
      Object.assign(S().fond, { type: 'image', image: im.src });
    } else if (cibleImage === 'nouvelle') {
      const w = Math.round(Math.min(W * 0.6, H * 0.6 * im.w / im.h)), h = Math.round(w * im.h / im.w);
      const e = { id: uid(), type: 'image', src: im.src, x: Math.round(W / 2 - w / 2), y: Math.round(H / 2 - h / 2), w, h, rot: 0, op: 1, miroir: false };
      S().elements.push(e);
      sel = e.id;
    } else {
      const e = trouver(cibleImage);
      if (e) { e.src = im.src; e.h = Math.round(e.w * im.h / im.w); }
    }
    commit();
    toutRendre();
  });

  $('#fichier-scene').addEventListener('change', ev => {
    const fichier = ev.target.files[0];
    ev.target.value = '';
    if (!fichier) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o.scenes || !o.scenes[o.format]) throw new Error('format');
        etat = o;
        sel = null;
        commit();
        toutRendre();
        toast('Scène ouverte');
      } catch (_) { toast('Ce fichier n\'est pas une scène du studio'); }
    };
    r.readAsText(fichier);
  });

  /* ---------- Souris, doigt, clavier ---------- */

  scene.addEventListener('pointerdown', ev => {
    const p = ev.target.closest('.poignee'), d0 = ev.target.closest('.el');
    if (!d0) { if (sel) choisir(null); return; }
    ev.preventDefault();
    const e = trouver(d0.dataset.id);
    if (sel !== e.id) choisir(e.id);
    const d = scene.querySelector(`.el[data-id="${e.id}"]`), r = d.getBoundingClientRect();
    geste = { mode: p ? p.dataset.p : 'bouge', e, d, x0: ev.clientX, y0: ev.clientY, ex: e.x, ey: e.y, rot: e.rot || 0,
      w: e.w, h: e.h, taille: e.taille, cx: r.left + r.width / 2, cy: r.top + r.height / 2, ow: d.offsetWidth, oh: d.offsetHeight };
    scene.setPointerCapture(ev.pointerId);
  });

  scene.addEventListener('pointermove', ev => {
    if (!geste) return;
    const g = geste, e = g.e, { W, H } = FORMATS[etat.format];
    if (g.mode === 'bouge') {
      let x = g.ex + (ev.clientX - g.x0) / s, y = g.ey + (ev.clientY - g.y0) / s, v = false, h = false;
      const seuil = 8 / s;
      if (Math.abs(x + g.ow / 2 - W / 2) < seuil) { x = W / 2 - g.ow / 2; v = true; }
      if (Math.abs(y + g.oh / 2 - H / 2) < seuil) { y = H / 2 - g.oh / 2; h = true; }
      e.x = Math.round(x);
      e.y = Math.round(y);
      guides(v, h);
    } else if (g.mode === 'taille') {
      const f = Math.max(0.05, Math.hypot(ev.clientX - g.cx, ev.clientY - g.cy) / Math.max(1, Math.hypot(g.x0 - g.cx, g.y0 - g.cy)));
      if (g.w) e.w = Math.max(20, Math.round(g.w * f));
      if (g.h) e.h = Math.max(20, Math.round(g.h * f));
      if (g.taille) e.taille = Math.max(8, Math.round(g.taille * f));
      e.x = Math.round(g.ex + g.ow / 2 - g.ow * f / 2);
      e.y = Math.round(g.ey + g.oh / 2 - g.oh * f / 2);
    } else {
      const a0 = Math.atan2(g.y0 - g.cy, g.x0 - g.cx), a1 = Math.atan2(ev.clientY - g.cy, ev.clientX - g.cx);
      let r = g.rot + (a1 - a0) * 180 / Math.PI;
      r = ((r + 540) % 360) - 180;
      if (ev.shiftKey) r = Math.round(r / 15) * 15;
      else if (Math.abs(r) < 3) r = 0;
      e.rot = Math.round(r);
    }
    placer(g.d, e);
  });

  function finGeste() {
    if (!geste) return;
    geste = null;
    guides(false, false);
    commit();
    rendrePanneaux();
  }
  scene.addEventListener('pointerup', finGeste);
  scene.addEventListener('pointercancel', finGeste);

  scene.addEventListener('dblclick', ev => {
    if (!ev.target.closest('.el')) return;
    const ta = $('#proprietes textarea');
    if (ta) { ta.focus(); ta.select(); }
  });

  document.addEventListener('keydown', ev => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    const mod = ev.ctrlKey || ev.metaKey, touche = ev.key.toLowerCase();
    if (mod && touche === 'z') { ev.preventDefault(); voyager(ev.shiftKey ? 1 : -1); return; }
    if (mod && touche === 'y') { ev.preventDefault(); voyager(1); return; }
    const e = sel && trouver(sel);
    if (!e) return;
    if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); supprimer(); }
    else if (mod && touche === 'd') { ev.preventDefault(); dupliquer(); }
    else if (ev.key === 'Escape') choisir(null);
    else if (ev.key.startsWith('Arrow')) {
      ev.preventDefault();
      const p = ev.shiftKey ? 20 : 2;
      if (ev.key === 'ArrowLeft') e.x -= p;
      if (ev.key === 'ArrowRight') e.x += p;
      if (ev.key === 'ArrowUp') e.y -= p;
      if (ev.key === 'ArrowDown') e.y += p;
      rendre();
      commitPlusTard();
    }
  });

  /* ---------- Barre du haut ---------- */

  $('#annuler').addEventListener('click', () => voyager(-1));
  $('#retablir').addEventListener('click', () => voyager(1));
  $('#zones').addEventListener('change', rendre);
  $('#png').addEventListener('click', exporterPNG);
  $('#enregistrer').addEventListener('click', () => telecharger(new Blob([JSON.stringify(etat, null, 1)], { type: 'application/json' }), 'scene-presentateur.json'));
  $('#ouvrir').addEventListener('click', () => $('#fichier-scene').click());
  $('#nouvelle').addEventListener('click', () => {
    if (!confirm('Repartir d\'une scène neuve ? (Ctrl+Z permet de revenir en arrière)')) return;
    etat = etatDefaut();
    sel = null;
    commit();
    toutRendre();
  });

  etat = charger();
  construireGauche();
  commit();
  toutRendre();
  new ResizeObserver(echelle).observe($('#cadre'));
  document.fonts.ready.then(rendre);
</script>
</body>
</html>
