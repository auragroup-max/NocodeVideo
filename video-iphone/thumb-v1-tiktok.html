<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Miniature TikTok v1 · le duel</title>
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  /* concept : un duel en écran coupé, business (jaune, ça monte) contre iPhone (noir, ça baisse) */
  :root { --encre:#141414; --gris:#6B675F; --rouge:#E0402A; --jaune:#F6C21C; --papier:#F1EEE8; }
  html, body { margin:0; background:#000; }
  #t { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Inter", sans-serif; -webkit-font-smoothing:antialiased; color:var(--encre); }
  .cote { position:absolute; inset:0; }
  .biz { background-color:var(--jaune); background-image:radial-gradient(#E2AC0B 3px, transparent 3.6px); background-size:36px 36px; clip-path:polygon(0 0, 600px 0, 480px 100%, 0 100%); }
  .tel { background-color:var(--encre); background-image:radial-gradient(#2E2E2E 3px, transparent 3.6px); background-size:36px 36px; clip-path:polygon(600px 0, 100% 0, 100% 100%, 480px 100%); }
  .titre { position:absolute; left:60px; right:60px; top:110px; padding:26px 34px 30px; background:#fff; border:7px solid var(--encre); border-radius:28px; transform:rotate(-2deg); box-shadow:14px 14px 0 var(--encre); text-align:center; }
  .titre b { display:block; font-weight:800; font-size:118px; line-height:1; letter-spacing:-0.045em; }
  .titre em { display:block; margin-top:6px; font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; font-size:112px; line-height:1; color:var(--rouge); }
  .rond { position:absolute; width:300px; height:300px; border-radius:50%; background:#fff; border:7px solid var(--encre); box-sizing:border-box; display:flex; align-items:center; justify-content:center; box-shadow:12px 12px 0 var(--encre); }
  .rond svg { width:180px; height:180px; }
  .ico { fill:none; stroke:#141414; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
  .lbl { position:absolute; padding:10px 22px; border-radius:16px; border:6px solid var(--encre); font-weight:800; font-size:54px; letter-spacing:-0.02em; white-space:nowrap; }
  .vs { position:absolute; left:425px; top:770px; width:230px; height:230px; border-radius:50%; background:var(--rouge); border:8px solid var(--encre); box-sizing:border-box; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:100px; letter-spacing:-0.05em; transform:rotate(-8deg); box-shadow:10px 10px 0 var(--encre); z-index:3; }
  #perso { position:absolute; left:20px; top:990px; width:1080px; z-index:2; }
</style>
</head>
<body>
<div id="t">
  <div class="cote biz"></div>
  <div class="cote tel"></div>
  <div class="titre"><b>iPhone</b><em>ou business ?</em></div>

  <div class="rond" style="left:90px;top:640px"><svg viewBox="0 0 120 120"><g class="ico"><path d="M16 46 L26 18 L94 18 L104 46 Z"/><path d="M16 46 Q27 60 38 46 Q49 60 60 46 Q71 60 82 46 Q93 60 104 46"/><path d="M24 56 L24 102 L96 102 L96 56 M50 102 L50 74 L70 74 L70 102"/></g></svg></div>
  <div class="lbl" style="left:70px;top:990px;background:#fff;transform:rotate(-4deg)">ça rapporte <span style="color:#E0402A">↑</span></div>

  <div class="rond" style="left:700px;top:640px;background:#2A2A2E"><svg viewBox="0 0 120 120"><g class="ico" style="stroke:#F1EEE8"><rect x="34" y="10" width="52" height="100" rx="12"/><path d="M52 94 L68 94"/></g></svg></div>
  <div class="lbl" style="left:690px;top:990px;background:#2A2A2E;color:#F1EEE8;border-color:#F1EEE8;transform:rotate(4deg)">ça baisse ↓</div>

  <div class="vs">VS</div>
  <img id="perso" src="assets/thumb-perso.png" alt="">
</div>
</body>
</html>
